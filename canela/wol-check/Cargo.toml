# Compila y prueba los parsers de src/canela_wol.rs (encender equipos a distancia) contra el
# hbb_common del fork, sin compilar RustDesk completo. Lo corre "CanelaRemote - prueba encendido".
[package]
name = "canela-wol-check"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
hbb_common = { path = "../../libs/hbb_common" }
serde_json = "1"
default-net = "0.14"
