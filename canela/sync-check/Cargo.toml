# Compila y prueba src/canela_sync.rs (sincronización con la cuenta) contra el hbb_common del
# fork, sin compilar RustDesk completo. Lo corre "CanelaRemote - prueba sincronización".
[package]
name = "canela-sync-check"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
hbb_common = { path = "../../libs/hbb_common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
