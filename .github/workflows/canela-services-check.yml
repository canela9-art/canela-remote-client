# Compila y prueba src/canela_services.rs (detección de puertos de BD) sin el build completo (~5 min).
name: CanelaRemote - prueba servicios

on:
  workflow_dispatch:
  push:
    paths: ["src/canela_services.rs", "canela/services-check/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Probar servicios
        run: |
          cd canela/services-check
          cargo run --quiet
