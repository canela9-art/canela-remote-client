# Compila y prueba src/canela_cmd.rs (comandos y capturas del MCP del dueño) sin el build completo (~5 min).
name: CanelaRemote - prueba comandos del dueño

on:
  workflow_dispatch:
  push:
    paths: ["src/canela_cmd.rs", "src/canela_ticket.rs", "canela/cmd-check/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Probar comandos del dueño
        run: |
          cd canela/cmd-check
          cargo run --quiet
