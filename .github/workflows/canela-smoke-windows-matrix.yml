# Diagnóstico: aísla si el cierre al abrir viene del nombre del .exe o del custom.txt.
name: CanelaRemote - diagnóstico Windows

on:
  workflow_dispatch:
    inputs:
      asset:
        default: canelaremote-1.4.9-x86_64.exe
      tag:
        default: canela-dev
      mode:
        default: debugger

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - name: Diagnóstico
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p "${{ inputs.asset }}" -D C:\dl
          Start-Process "C:\dl\${{ inputs.asset }}" -ArgumentList "--version" -Wait
          Start-Sleep 5
          Get-Process | Where-Object { $_.Name -match 'canela|rustdesk' } | Stop-Process -Force -ErrorAction SilentlyContinue
          $src = "$env:LOCALAPPDATA\rustdesk"
          "custom.txt:"; Get-Content "$src\custom.txt"
          function Try-Variant($name, $exe, $withCustom) {
            $d = "C:\t\$name"
            Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue
            Copy-Item -Recurse $src $d
            Remove-Item "$d\meta.toml" -ErrorAction SilentlyContinue
            if ($exe -ne 'CanelaRemote.exe') { Rename-Item "$d\CanelaRemote.exe" $exe }
            if (-not $withCustom) { Remove-Item "$d\custom.txt" }
            Remove-Item -Recurse -Force "$env:APPDATA\CanelaRemote", "$env:APPDATA\RustDesk" -ErrorAction SilentlyContinue
            $p = Start-Process "$d\$exe" -PassThru -RedirectStandardOutput "$d\out.txt" -RedirectStandardError "$d\err.txt"
            Start-Sleep 30
            $procs = Get-Process | Where-Object { $_.Name -match 'canela|rustdesk' }
            "=== $name  exe=$exe custom=$withCustom  alive=$(-not $p.HasExited) exit=$($p.ExitCode)"
            $procs | Format-Table Id, Name, MainWindowTitle -AutoSize | Out-String -Width 200
            "stdout:"; Get-Content "$d\out.txt" -ErrorAction SilentlyContinue | Select-Object -Last 20
            "stderr:"; Get-Content "$d\err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 20
            foreach ($l in "$env:APPDATA\CanelaRemote\log", "$env:APPDATA\RustDesk\log") {
              Get-ChildItem $l -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { "== log $($_.FullName)"; Get-Content $_.FullName -Tail 25 }
            }
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddSeconds(-40)} -ErrorAction SilentlyContinue | Where-Object { $_.LevelDisplayName -ne 'Information' } | Format-List TimeCreated, ProviderName, Message | Out-String -Width 300
            $procs | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep 3
          }
          if ("${{ inputs.mode }}" -eq "matrix") {
            Try-Variant a CanelaRemote.exe $true
            Try-Variant b CanelaRemote.exe $false
            Try-Variant c rustdesk.exe $true
            Try-Variant d rustdesk.exe $false
            exit 0
          }
          # modo debugger: dónde termina el proceso con custom.txt
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { $cdb = Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits" -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 }
          "cdb: $($cdb.FullName)"
          $d = "C:\t\dbg"; Copy-Item -Recurse $src $d; Remove-Item "$d\meta.toml" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:APPDATA\CanelaRemote" -ErrorAction SilentlyContinue
          $env:_NT_SYMBOL_PATH = "srv*C:\sym*https://msdl.microsoft.com/download/symbols"
          @'
          sxe -c "kn 80; g" av
          sxe -c ".echo FASTFAIL; kn 80; q" 0xc0000409
          bp ntdll!NtTerminateProcess ".echo TERMINATE; ~.; kn 80; g"
          bu ucrtbase!abort ".echo ABORT; kn 80; g"
          bu ucrtbase!exit ".echo EXIT; kn 80; g"
          bu ucrtbase!_exit ".echo _EXIT; kn 80; g"
          bu ucrtbase!raise ".echo RAISE; kn 80; g"
          g
          '@ | Set-Content -Encoding ascii C:\t\cmds.txt
          $p = Start-Process $cdb.FullName -ArgumentList @('-G', '-logo', 'C:\t\cdb.log', '-cf', 'C:\t\cmds.txt', "$d\CanelaRemote.exe") -PassThru -NoNewWindow
          Start-Sleep 60
          if (-not $p.HasExited) { "cdb sigue vivo"; $p | Stop-Process -Force }
          Get-Process | Where-Object { $_.Name -match 'canela|rustdesk' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Content C:\t\cdb.log | Select-String -NotMatch "^ModLoad|Symbol search path|^Executable search" | Select-Object -Last 250
