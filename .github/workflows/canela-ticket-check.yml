# Compila y prueba src/canela_ticket.rs (tickets de conexión) sin el build completo (~5 min).
name: CanelaRemote - prueba tickets

on:
  workflow_dispatch:
  push:
    paths: ["src/canela_ticket.rs", "canela/ticket-check/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Probar tickets
        run: |
          cd canela/ticket-check
          cargo run --quiet
