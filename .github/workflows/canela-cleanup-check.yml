# Compila y prueba src/canela_cleanup.rs (impresora sobrante de RustDesk) sin el build completo (~5 min).
name: CanelaRemote - prueba limpieza

on:
  workflow_dispatch:
  push:
    paths: ["src/canela_cleanup.rs", "canela/cleanup-check/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Probar limpieza
        run: |
          cd canela/cleanup-check
          cargo run --quiet
