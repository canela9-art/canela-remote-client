# Compila y prueba src/canela_wol.rs (encender equipos a distancia) sin el build completo (~5 min).
name: CanelaRemote - prueba encendido

on:
  workflow_dispatch:
  push:
    paths: ["src/canela_wol.rs", "canela/wol-check/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Probar encendido
        run: |
          cd canela/wol-check
          cargo run --quiet
