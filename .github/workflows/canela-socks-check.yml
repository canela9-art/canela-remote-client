# Compila y prueba src/canela_socks.rs (acceso a toda la red) sin el build completo (~5 min).
name: CanelaRemote - prueba acceso a la red

on:
  workflow_dispatch:
  push:
    paths: ["src/canela_socks.rs", "canela/socks-check/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - name: Probar acceso a la red
        run: |
          cd canela/socks-check
          cargo run --quiet
